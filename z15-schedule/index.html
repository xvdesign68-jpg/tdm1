<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lịch làm việc · Z15 Miracle</title>
  <meta name="description" content="Hệ thống quản lý lịch làm việc, phân ca và dự án dành cho đội ngũ Z15 Miracle Việt Nam.">
  <meta name="theme-color" content="#F7F7F5">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/views/dashboard.css">
  <link rel="stylesheet" href="css/views/calendar.css">
  <link rel="stylesheet" href="css/views/roster.css">
  <link rel="stylesheet" href="css/views/staff.css">
  <link rel="stylesheet" href="css/views/projects.css">
  <link rel="stylesheet" href="css/views/requests.css">
  <script>
    // Áp theme sớm để tránh chớp trắng/đen khi tải
    (function () { try { var s = JSON.parse(localStorage.getItem('z15.schedule.v1') || 'null'); var t = s && s.settings && s.settings.theme || 'system'; var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; if (s && s.settings && s.settings.sidebarCollapsed) document.documentElement.classList.add('pre-collapsed'); } catch (e) { } })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Bỏ qua tới nội dung</a>
  <!-- Màn chào: logo "lắp ráp" rồi rút -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash__logo">
      <svg viewBox="0 0 120 120" width="88" height="88" aria-hidden="true">
        <polygon class="splash__wing splash__wing--l" points="13,9 13,30 54,57 54,36" fill="#D71920" stroke="#D71920" stroke-width="5" stroke-linejoin="round"/>
        <polygon class="splash__wing splash__wing--r" points="107,9 107,30 66,57 66,36" fill="#D71920" stroke="#D71920" stroke-width="5" stroke-linejoin="round"/>
        <polygon class="splash__shield" points="14,40 60,70 106,40 92,96 60,113 28,96" fill="#0B2FA6" stroke="#0B2FA6" stroke-width="5" stroke-linejoin="round"/>
        <path class="splash__arrow" d="M60 77 V97 M47 84 L60 97 L73 84" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="splash__word"><b>Z15 MIRACLE</b><small>Lịch làm việc</small></div>
    </div>
  </div>

  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
      <a class="brand" id="brand" href="#/dashboard" aria-label="Z15 Miracle — Tổng quan"></a>
      <nav class="sidebar__nav" id="nav" aria-label="Các mục"></nav>
      <span class="nav-ind" id="navInd" aria-hidden="true"></span>
      <div class="sidebar__foot">
        <div class="sidebar__tip">
          <span class="sidebar__tip-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg></span>
          <span class="sidebar__tip-txt">Nhấn <kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd> để tìm nhanh mọi thứ</span>
        </div>
        <button class="icon-btn sidebar__collapse" id="collapseBtn" aria-label="Thu gọn menu" aria-expanded="true" data-tip="Thu gọn menu" data-tip-pos="right">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
        </button>
      </div>
    </aside>
    <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menuBtn" aria-label="Mở menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
        </button>
        <div class="topbar__titles">
          <h1 class="topbar__title" id="pageTitle"></h1>
          <p class="topbar__sub" id="pageSub"></p>
        </div>
        <div class="topbar__actions" id="pageActions"></div>
        <div class="topbar__spacer"></div>
        <button class="search-btn" id="searchBtn" aria-label="Tìm kiếm (Ctrl+K)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="search-btn__txt">Tìm kiếm…</span>
          <span class="search-btn__kbd"><kbd class="kbd">⌘</kbd><kbd class="kbd">K</kbd></span>
        </button>
        <div class="topbar__time" aria-live="off"><b id="clock" class="tnum">--:--</b><span id="dateLabel"></span></div>
        <button class="btn btn--soft btn--new" id="newBtn" aria-haspopup="menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
          <span>Tạo mới</span>
        </button>
        <button class="icon-btn theme-btn" id="themeBtn" aria-label="Đổi giao diện" data-tip="Đổi giao diện"></button>
        <button class="icon-btn bell-btn" id="bellBtn" aria-label="Thông báo" aria-haspopup="dialog" data-tip="Thông báo">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="bell-btn__count" id="bellCount" hidden>0</span>
        </button>
        <button class="user-btn" id="userBtn" aria-haspopup="menu" aria-label="Tài khoản"></button>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/editors.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/roster.js"></script>
  <script src="js/views/staff.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/requests.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
